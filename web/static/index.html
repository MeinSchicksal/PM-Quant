<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light">
  <title>PM-Quant · 资方看板</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand" aria-label="PM-Quant 资方看板">
      <span class="brand-mark">P</span>
      <span class="brand-name">PM-Quant</span>
      <span class="brand-divider"></span>
      <span class="brand-view">资方看板</span>
    </div>
    <div class="connection" id="connection">
      <span class="connection-dot"></span>
      <span id="connection-text">正在连接</span>
    </div>
  </header>

  <main class="page">
    <section class="money-panel" aria-label="核心收益指标">
      <div class="money-heading">
        <div>
          <p class="eyebrow">5 分钟做市机器人 · 模拟盘</p>
          <h1>收益结果</h1>
        </div>
        <span class="settled-note" id="settled-note">已结算 0 轮</span>
      </div>

      <div class="metrics">
        <article class="metric metric-primary">
          <p class="metric-label">累计净收益</p>
          <p class="metric-value" id="kpi-pnl">$0.00</p>
          <p class="metric-foot" id="kpi-pnl-foot">真金白银的累计结果</p>
        </article>
        <article class="metric">
          <p class="metric-label">胜率</p>
          <p class="metric-value" id="kpi-winrate">0.0%</p>
          <p class="metric-foot" id="kpi-winloss">0 赢 · 0 亏</p>
        </article>
        <article class="metric">
          <p class="metric-label">单场平均盈亏</p>
          <p class="metric-value" id="kpi-average">$0.00</p>
          <p class="metric-foot">按有成交的已结算轮次计算</p>
        </article>
      </div>
    </section>

    <section class="journal" aria-label="逐轮动作流水">
      <div class="journal-heading">
        <div>
          <p class="eyebrow">ROUND BY ROUND</p>
          <h2>每一轮，机器人做了什么</h2>
          <p class="journal-subtitle">挂单、成交、对冲、结果，按发生时间逐条列清。</p>
        </div>
        <span class="updated-at" id="updated-at">等待数据</span>
      </div>

      <div class="rounds" id="rounds" aria-live="polite">
        <div class="loading-state">
          <span class="loading-line"></span>
          <span class="loading-line short"></span>
        </div>
      </div>
    </section>

    <footer class="page-footer">
      <span>金额单位为美元</span>
      <span>收益指标仅统计已结算轮次</span>
    </footer>
  </main>

  <template id="empty-template">
    <div class="empty-state">
      <span class="empty-mark">P</span>
      <h3>还没有已记录的轮次</h3>
      <p>机器人完成第一轮后，挂单和收益会出现在这里。</p>
    </div>
  </template>

  <script src="/static/app.js"></script>
</body>
</html>
